openapi: 3.0.3
info:
  title: shippin.tech API v1
  description: 'The management API for alpha 0.5. One prefix, one error shape (RFC 9457 problem details, content
    type application/problem+json). Configuration and mail data stay in native JMAP (RFC 8620, 8621); routes
    here are thin layers over it. See api/DESIGN.md. No compatibility is promised for anything in this file
    before 1.0.


    Rules: an absent value is omitted, never null (the UI contract in ui/src/lib/contract/v1.ts rejects null for
    optional fields). ui/test/contract-v1.test.ts compares the schemas below with that contract.'
  version: '0.5'
servers:
- url: https://{host}
  variables:
    host:
      default: mail.example.com
paths:
  /api/v1/me:
    get:
      operationId: getMe
      summary: Who is signed in and what they may do
      description: The role is decided by the server from live state (organisation, free-plan domain,
        permissions); clients never infer it.
      x-auth: any signed-in account
      x-proof: deploy/local/verify_v1.py
      responses:
        '200':
          description: The caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/registry/{object}:
    parameters:
    - {name: object, in: path, required: true, schema: {type: string}, description: 'A registry object type, for example Domain (the JMAP method is x:Domain/*). Standard JMAP mail types (Mailbox, Email) are not here.'}
    get:
      operationId: listRegistry
      summary: List a collection's records, or read a singleton
      description: 'One JMAP request, x:{object}/query then x:{object}/get, run as the caller. A singleton object has exactly one record and is returned as that record, not as a page.'
      x-auth: any signed-in account; JMAP decides per object type
      x-proof: deploy/local/verify_registry.py, ui/test-live/registry-live.test.ts
      parameters:
      - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 50}}
      - {name: position, in: query, schema: {type: integer, minimum: 0, default: 0}}
      - {name: filter, in: query, schema: {type: string}, description: 'A JMAP filter as a JSON object, passed through'}
      - {name: sort, in: query, schema: {type: string, pattern: '^-?[A-Za-z0-9_]{1,64}$'}, description: 'One property to sort by; a leading - sorts descending. The server refuses a property it cannot sort by (400)'}
      responses:
        '200':
          description: A page of records (collections) or the singleton record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistryPage'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createRegistryRecord
      summary: Create a record (collections)
      description: 'The body is the record without server-set properties. Action creates return the action output, which need not contain id or @type. AppPassword creates return id and the generated secret exactly once.'
      x-auth: JMAP decides
      x-proof: deploy/local/verify_registry.py
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object}
      responses:
        '201':
          description: The created record or action output
          content:
            application/json:
              schema:
                anyOf:
                - {$ref: '#/components/schemas/RegistryRecord'}
                - {type: object, description: 'Action output fields depend on the requested action; no id or discriminator is required.'}
        default:
          $ref: '#/components/responses/Problem'
    patch:
      operationId: updateRegistrySingleton
      summary: Change a singleton object
      description: 'Accepts field patches, including otpAuth/otpCode and otpAuth/otpUrl for AccountPassword. Bootstrap returns id and any one-time username/secret from the completed operation; these credentials cannot be recovered by reading the record again.'
      x-auth: JMAP decides
      x-proof: deploy/local/verify_registry.py
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, description: 'A JMAP patch object'}
      responses:
        '200':
          description: The record as it is now
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RegistryRecord'}
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/registry/{object}/{id}:
    parameters:
    - {name: object, in: path, required: true, schema: {type: string}}
    - {name: id, in: path, required: true, schema: {type: string, pattern: '^[A-Za-z0-9_-]{1,64}$'}}
    get:
      operationId: getRegistryRecord
      summary: Read one record
      description: 'The answer carries an ETag: a hash of the properties a person can change (server-set properties are left out). Send it back as If-Match on PATCH or DELETE.'
      x-auth: JMAP decides
      x-proof: deploy/local/verify_registry.py
      responses:
        '200':
          description: The record
          headers:
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RegistryRecord'}
        default:
          $ref: '#/components/responses/Problem'
    patch:
      operationId: updateRegistryRecord
      summary: Change a record
      description: 'The body is a JMAP patch object (a key like a/b changes one nested value). The answer is the record as it is now, with its new ETag. With If-Match, a record that changed since it was read is refused with 412 (type stale); without it the change is applied.'
      x-auth: JMAP decides
      x-proof: deploy/local/verify_registry.py
      parameters:
      - {name: If-Match, in: header, required: false, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object}
      responses:
        '200':
          description: The record as it is now
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RegistryRecord'}
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteRegistryRecord
      summary: Remove a record
      description: 'A record that other records depend on is refused with 409 objectIsLinked. With If-Match, a record that changed since it was read is refused with 412 (type stale).'
      parameters:
      - {name: If-Match, in: header, required: false, schema: {type: string}}
      x-auth: JMAP decides
      x-proof: deploy/local/verify_registry.py
      responses:
        '204':
          description: Removed
        default:
          $ref: '#/components/responses/Problem'
components:
  responses:
    Problem:
      description: Any failure
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    RegistryRecord:
      type: object
      required: [id]
      description: 'The shape of the rest depends on the object type; ui/src/lib/contract/registry.generated.ts is generated from the server schema (resources/schema/schema.json.gz) and checked against live data.'
      properties:
        id: {type: string, minLength: 1}
      additionalProperties: true
    RegistryPage:
      type: object
      required: [items, position]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/RegistryRecord'}}
        position: {type: integer, minimum: 0}
        total: {type: integer, minimum: 0}
    Role:
      type: string
      enum: [admin, org, owner, user]
      description: org runs an organisation, owner runs a free-plan domain, admin operates the server.
    Me:
      type: object
      required: [email, role, permissions]
      properties:
        email: {type: string, minLength: 1}
        role: {$ref: '#/components/schemas/Role'}
        permissions: {type: array, items: {type: string}}
        edition: {type: string}
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: {type: string, minLength: 1}
        title: {type: string, minLength: 1}
        status: {type: integer, minimum: 400, maximum: 599}
        detail: {type: string}
        fields: {type: object, additionalProperties: {type: string}}
